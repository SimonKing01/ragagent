<!DOCTYPE html>
<html lang="en">
<head>
    <title>RagAgent Embed</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimal-ui">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <link rel="shortcut icon" type="image/png" href="./public/favicon.ico"/>
    <link rel="stylesheet" href="/embed-boot.css">
    <style>
      html, body, #embed-app { height: 100%; margin: 0; }
    </style>
</head>
<body>
<script>
(function(){
  document.documentElement.setAttribute('theme-mode', 'light');
  document.documentElement.style.background = '#fff';
  document.body.style.background = '#fff';
})();
</script>
<!-- 骨架必须排在下面两个脚本之前：脚本是解析阻塞的，排在它们之后就要等下载执行完才有 DOM。 -->
<div id="embed-app">
  <!-- 首屏骨架：样式见 /embed-boot.css，与 EmbedBootSkeleton.vue 同构，Vue 挂载时被替换 -->
  <div class="embed-boot" aria-hidden="true">
    <div class="embed-boot__header">
      <span class="eb-skel embed-boot__avatar"></span>
      <span class="eb-skel embed-boot__title"></span>
      <span class="eb-skel embed-boot__action"></span>
      <span class="eb-skel embed-boot__action"></span>
    </div>
    <div class="embed-boot__body embed-boot__body--intro">
      <span class="eb-skel eb-intro-greeting" data-boot-variant="greeting"></span>
      <span class="eb-skel eb-intro-label" data-boot-variant="greeting"></span>
      <span class="eb-skel eb-row" data-boot-variant="greeting"></span>
      <span class="eb-skel eb-row" data-boot-variant="greeting"></span>
      <span class="eb-skel eb-bubble eb-bubble--user" data-boot-variant="conversation"></span>
      <span class="eb-skel eb-bubble" data-boot-variant="conversation"></span>
      <span class="eb-skel eb-bubble" data-boot-variant="conversation"></span>
    </div>
    <div class="embed-boot__footer">
      <span class="eb-skel embed-boot__input"></span>
    </div>
  </div>
</div>
<script>
(function(){
  // 有存量会话 ⇒ 首屏直接画「对话气泡」骨架：历史消息加载时用的是同形骨架，
  // 不会出现「问候屏骨架 → 对话骨架」的切换。（读不到就保持问候屏形态）
  try {
    var seg = location.pathname.split('/').filter(Boolean);
    var idx = seg.indexOf('embed');
    var channel = idx >= 0 ? seg[idx + 1] : '';
    if (!channel) return;
    if (localStorage.getItem('ragagent-embed-session:' + channel)) {
      var boot = document.querySelector('.embed-boot');
      if (boot) boot.className += ' embed-boot--conversation';
    }
  } catch (e) { /* 隐私模式等读不到 localStorage：保持问候屏形态 */ }
})();
</script>
<script src="/config.js"></script>
<!-- 图标 sprite 需在 Vue 挂载前注册，否则首帧的 <t-icon> 取不到符号；保持同步加载即可。 -->
<script src="/tdesign-icons/0.4.1/fonts/index.js"></script>
<script type="module" src="/src/embed-main.ts"></script>
</body>
</html>
