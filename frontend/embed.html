<!DOCTYPE html>
<html lang="en">
<head>
    <title>RagAgent Embed</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimal-ui">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <link rel="shortcut icon" type="image/png" href="./public/favicon.ico"/>
    <link rel="stylesheet" href="/embed-boot.css">
    <style>
      html, body, #embed-app { height: 100%; margin: 0; }
    </style>
</head>
<body>
<script>
(function(){
  document.documentElement.setAttribute('theme-mode', 'light');
  document.documentElement.style.background = '#fff';
  document.body.style.background = '#fff';
})();
</script>
<!-- 骨架必须排在下面两个脚本之前：脚本是解析阻塞的，排在它们之后就要等下载执行完才有 DOM。 -->
<div id="embed-app">
  <!-- 首屏只有转圈：此时还不知道要加载历史会话还是新会话，骨架留给「形态已定」之后 -->
  <div class="eb-boot-spinner" aria-hidden="true">
    <span class="eb-boot-spinner__ring"></span>
  </div>

<script src="/config.js"></script>
<!-- 图标 sprite 需在 Vue 挂载前注册，否则首帧的 <t-icon> 取不到符号；保持同步加载即可。 -->
<script src="/tdesign-icons/0.4.1/fonts/index.js"></script>
<script type="module" src="/src/embed-main.ts"></script>
</body>
</html>
