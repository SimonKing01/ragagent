# Built-in Agent Configuration with i18n support
# Each agent has localized name, description, avatar, and config overrides per language.
# The "default" locale is used as fallback when the user's language is not found.

builtinAgents:
  - id: "builtin-quick-answer"
    avatar: ""
    isBuiltin: true
    i18n:
      default:
        name: "Quick Answer"
        description: "Knowledge base RAG Q&A for fast and accurate answers"
      zh-CN:
        name: "快速问答"
        description: "基于知识库的 RAG 问答，快速准确地回答问题"
      zh-TW:
        name: "快速問答"
        description: "基於知識庫的 RAG 問答，快速準確地回答問題"
    config:
      agentMode: "quick-answer"
      systemPromptId: "default_kb"
      contextTemplateId: "default_context"
      temperature: 0.7
      maxCompletionTokens: 0
      webSearchEnabled: true
      webSearchMaxResults: 5
      multiTurnEnabled: true
      historyTurns: 5
      kbSelectionMode: "all"
      retrieveKbOnlyWhenMentioned: false
      faqPriorityEnabled: true
      faqDirectAnswerThreshold: 0.9
      faqScoreBoost: 1.2
      embeddingTopK: 10
      keywordThreshold: 0.3
      vectorThreshold: 0.5
      rerankTopK: 10
      rerankThreshold: 0.3
      enableQueryExpansion: true
      enableRewrite: true
      fallbackStrategy: "model"

  - id: "builtin-smart-reasoning"
    avatar: ""
    isBuiltin: true
    i18n:
      default:
        name: "Smart Reasoning"
        description: "ReAct reasoning framework with multi-step thinking and tool calling"
      zh-CN:
        name: "智能推理"
        description: "ReAct 推理框架，支持多步思考与工具调用"
      zh-TW:
        name: "智能推理"
        description: "ReAct 推理框架，支援多步思考與工具呼叫"
    config:
      agentMode: "smart-reasoning"
      agentType: "rag-qa"
      systemPrompt: ""
      temperature: 0.7
      maxCompletionTokens: 0
      maxIterations: 50
      kbSelectionMode: "all"
      retrieveKbOnlyWhenMentioned: false
      allowedTools:
        - "knowledge_search"
        - "grep_chunks"
        - "list_knowledge_chunks"
        - "query_knowledge_graph"
        - "get_document_info"
      webSearchEnabled: true
      webSearchMaxResults: 5
      reflection_enabled: false
      multiTurnEnabled: true
      historyTurns: 5
      faqPriorityEnabled: true
      faqDirectAnswerThreshold: 0.9
      faqScoreBoost: 1.2
      embeddingTopK: 10
      keywordThreshold: 0.3
      vectorThreshold: 0.5
      rerankTopK: 10
      rerankThreshold: 0.3

  - id: "builtin-data-analyst"
    avatar: "📊"
    isBuiltin: true
    i18n:
      default:
        name: "Data Analyst"
        description: "Professional data analysis agent with SQL query and statistical analysis for CSV/Excel files"
      zh-CN:
        name: "数据分析师"
        description: "专业的数据分析智能体，支持对 CSV/Excel 文件进行 SQL 查询和统计分析"
      zh-TW:
        name: "數據分析師"
        description: "專業的數據分析智能體，支援對 CSV/Excel 檔案進行 SQL 查詢和統計分析"
    config:
      agentMode: "smart-reasoning"
      agentType: "data-analysis"
      systemPromptId: "data_analyst"
      temperature: 0.3
      maxCompletionTokens: 0
      maxIterations: 30
      kbSelectionMode: "all"
      retrieveKbOnlyWhenMentioned: false
      supportedFileTypes:
        - "csv"
        - "xlsx"
      allowedTools:
        - "data_schema"
        - "data_analysis"
      webSearchEnabled: false
      webSearchMaxResults: 0
      reflection_enabled: true
      multiTurnEnabled: true
      historyTurns: 10
      embeddingTopK: 5
      keywordThreshold: 0.3
      vectorThreshold: 0.5
      rerankTopK: 5
      rerankThreshold: 0.3

  - id: "builtin-wiki-researcher"
    avatar: "📚"
    isBuiltin: true
    i18n:
      default:
        name: "Wiki Questioner"
        description: "Specialized agent for answering questions based on Wiki knowledge bases"
      zh-CN:
        name: "维基问答"
        description: "专注于在 Wiki 知识库中回答问题的智能体"
      zh-TW:
        name: "維基問答"
        description: "專注於在 Wiki 知識庫中回答問題的智能體"
    config:
      agentMode: "smart-reasoning"
      agentType: "wiki-qa"
      systemPromptId: "wiki_researcher"
      temperature: 0.7
      maxCompletionTokens: 0
      maxIterations: 30
      kbSelectionMode: "all"
      retrieveKbOnlyWhenMentioned: false
      allowedTools:
        - "wiki_search"
        - "wiki_read_page"
        - "wiki_read_source_doc"
        - "wiki_flag_issue"
      webSearchEnabled: false
      webSearchMaxResults: 0
      reflection_enabled: false
      multiTurnEnabled: true
      historyTurns: 10
      embeddingTopK: 10
      keywordThreshold: 0.3
      vectorThreshold: 0.5
      rerankTopK: 10
      rerankThreshold: 0.3

  - id: "builtin-wiki-fixer"
    avatar: "🔧"
    isBuiltin: true
    i18n:
      default:
        name: "Wiki Fixer"
        description: "Specialized agent for revising Wiki pages based on inspection issues"
      zh-CN:
        name: "维基修订"
        description: "专门用于根据巡检问题修订 Wiki 页面的智能体"
      zh-TW:
        name: "維基修訂"
        description: "專門用於根據巡檢問題修訂 Wiki 頁面的智能體"
    config:
      agentMode: "smart-reasoning"
      agentType: "custom"
      systemPromptId: "wiki_fixer"
      temperature: 0.7
      maxCompletionTokens: 0
      maxIterations: 30
      kbSelectionMode: "selected"
      retrieveKbOnlyWhenMentioned: false
      retainRetrievalHistory: true
      allowedTools:
        - "wiki_search"
        - "wiki_read_page"
        - "wiki_read_source_doc"
        - "wiki_write_page"
        - "wiki_replace_text"
        - "wiki_rename_page"
        - "wiki_delete_page"
        - "wiki_read_issue"
        - "wiki_update_issue"
      webSearchEnabled: false
      webSearchMaxResults: 0
      reflection_enabled: false
      multiTurnEnabled: true
      historyTurns: 10
      embeddingTopK: 10
      keywordThreshold: 0.3
      vectorThreshold: 0.5
      rerankTopK: 10
      rerankThreshold: 0.3

