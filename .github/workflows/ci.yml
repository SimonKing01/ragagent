# CI 起步三样：build / test / Spotless（docs/internal/HANDOFF.md §8）。
# 测试自含（契约 fixture，无 Testcontainers）；backend job 另起 ParadeDB 服务容器（B158）：
# 灌基线（全新库守卫）+ 支撑两个连真 PG 的录测试。
# 2026-09-30 增：包结构守卫（环 / 分层棘轮，scripts/check-package-cycles.py）。
# 2026-10-02 增（B10）：架构规则随测试套件跑（boot/src/test/.../arch/ArchitectureRulesTest.java（B165 迁入）：
#   禁裸 getenv / 属性类必须被 @ConfigurationPropertiesScan 覆盖 / 配置类不得双装配 /
#   install* 只许装配层调用）——后端 job 的 `mvn -B verify` 即闸门；包级规则仍归上面的 guards job。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# action 版本（2026-10-10 B180）：原来全线 @v4 ⇒ CI 注解里堆了 3 条弃用提醒
# （Node20 → Node24、setup-java@v4 弃用）。现升到各仓最新大版本（checkout v7 / setup-java v6 /
# setup-node v7 / setup-java v6），仍按本仓惯例**浮动大版本** ⇒ 弃用提醒的根因去掉。
# 2026-11-07 钉 `ubuntu-24.04`：`ubuntu-latest` 迁到 Ubuntu 26 后，platform 的
# 嵌入式 redis-server 在 initServer 阶段被杀（日志停在 "Running mode=standalone, port="，
# 进程 alive=false，用例全报 "Redis command timed out"）。按此前的退路约定回钉 24.04，
# 逐项适配 26 之后再放开。

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: 包结构守卫（环 / 分层棘轮）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # 守卫跑**同一份** scripts/run-guards.sh：本地 `bash scripts/run-guards.sh` 即 CI 同口径。
      # 本地手敲守卫容易漏开关（如 check-json-key-case 的 --strict 默认只报告）⇒ 本地绿而 CI 红。
      - name: 守卫（单一入口：scripts/run-guards.sh，含 48 条；本地同口径）
        run: bash scripts/run-guards.sh
  backend:
    name: 后端 build + test + spotless
    runs-on: ubuntu-24.04
    services:
      # 与 docker-compose.yml 同镜像同口令（dev 1:1，B158）。CI 也起真库的两条理由：
      #   ① 灌库守卫：V1__baseline.sql 必须能灌进**全新** ParadeDB（B156 那类只有真库才暴露的缺陷）；
      #   ② 两个录测试（GrepChunksRecordingTest / DatabaseQueryRecordingTest）连真 PG 才跑 ——
      #      B157 曾因 CI 无库把它们按标签排除，现由本服务支撑、回归真跑（顺带成为 schema 冒烟）。
      postgres:
        image: paradedb/paradedb:v0.22.2-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123!@#
          POSTGRES_DB: WeKnora
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # spotless ratchetFrom('seed') 需要基线 tag 可达
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # 嵌入式 Redis 依赖 `redis-server` 在 PATH 上（common 的 EmbeddedRedis 夹具会自己起实例）。
      # ubuntu-latest 不带它 ⇒ 4 个 Redis 测试被 assumeTrue **静默跳过**（B170 实测：本地收窄 PATH
      # 复现出同样的 4 skipped，而 CI 只报 '4 skipped' 看不出丢了什么覆盖）。与 B158「CI 起真 PG」同一精神。
      - name: 装 redis-server（让 Redis 测试在 CI 真跑，不再静默跳过）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server
      - name: 灌迁移（全新库守卫：versioned 下全部迁移必须按序灌进空 ParadeDB）
        env:
          PGPASSWORD: 'postgres123!@#'
        run: |
          for f in migrations/versioned/V*.sql; do
            echo "applying $f"
            psql -h localhost -p 15432 -U postgres -d WeKnora -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Spotless check（ratchet 自 seed，仅检查触碰过的文件）
        run: mvn -B spotless:check
      - name: Build & test（PG 走默认 localhost:15432 + dev 同口令 ⇒ 两个录测试真跑）
        # `tee` 落盘 + pipefail 保退出码 ⇒ 失败时下面的注解步能把关键行变成注解（公开 API 可读 ✓）
        run: set -o pipefail; mvn -B verify 2>&1 | tee /tmp/build.log

      - name: 启动冒烟（真实 jar：/health 200 + Scalar/API 文档默认 404）
        run: bash scripts/ci-smoke.sh

      # B175：构建失败也自证 —— 日志要鉴权才看得到 ✗，这里把关键行（Failed to execute goal / OOM / 测试失败 …）
      # 变成 ::error 注解 ⇒ job 页与公开 API 都能读 ✓。
      - name: 构建日志关键行（失败时把"为什么红"变成注解）
        if: failure()
        run: python3 scripts/ci-log-annotate.py /tmp/build.log

      # B171：失败/跳过都摆上台面 —— 失败用例名 + 首行消息、**跳过用例名 + 原因**（跳过 = 覆盖没跑）。
      # 在 Actions 里还会发 ::error/::notice 注解 ⇒ 可用公开 API 读（无需人肉捞日志）。
      - name: 测试汇总（失败与跳过清单；失败时也跑）
        if: always()
        run: python3 scripts/test-summary.py

  docker:
    name: 服务端镜像构建（Dockerfile 防腐化）
    runs-on: ubuntu-24.04
    # 本 job 的由来（B212）：Dockerfile 长期只存在于仓库、不进任何 job ⇒ 里面写着**已裁撤的
    # `:server` 模块名**、漏拷三个模块与 proto 源目录，`docker build` 必然失败却没人知道。
    # 路径腐化只能靠"真构建一次"发现，文本扫描扫不出来。
    steps:
      - uses: actions/checkout@v7
      # 只验"能构建"，不起容器（起容器要挂 PG/Redis 服务容器，成本远大于收益；
      # 应用层行为由 backend job 在真 PG 上覆盖）。
      # 提速空间（未取）：换 `docker/build-push-action` + `cache-from: type=gha` 可复用依赖层。
      - name: 构建镜像
        run: docker build -t ragagent-server:ci .
      # 构建能过 ≠ 镜像能启动：Flyway 的 `filesystem:./build/generated-migrations` 是**相对工作目录**
      # 的路径，漏落地则全新容器静默无 schema（classpath 位置是空的，不报错，直到第一条查询才炸）。
      - name: 自检：迁移目录随镜像落地（Flyway filesystem 路径）
        run: >
          docker run --rm --entrypoint sh ragagent-server:ci -c
          'test -s /app/app.jar && test -s /app/build/generated-migrations/V1__baseline.sql'
  frontend:
    name: 前端 type-check + test + build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build-only

  integration:
    name: 真实驱动集成（Milvus/Weaviate，*IT）
    runs-on: ubuntu-24.04
    steps:
      # spotless 的 ratchetFrom('seed') 需要基线 tag 可达；浅克隆会报 No such reference 'seed'
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: 起 Milvus（standalone）
        run: |
          docker run -d --name it-milvus --security-opt seccomp=unconfined \
            -p 19530:19530 -p 9091:9091 \
            -e ETCD_USE_EMBED=true -e ETCD_DATA_DIR=/var/lib/milvus/etcd \
            -e COMMON_STORAGETYPE=local -e DEPLOY_MODE=STANDALONE \
            milvusdb/milvus:v2.6.11 milvus run standalone
      - name: 起 Weaviate（GSE 分词必须开）
        run: |
          docker run -d --name it-weaviate \
            -p 9035:8080 -p 50052:50051 \
            -e DEFAULT_VECTORIZER_MODULE=none -e ENABLE_MODULES=none \
            -e ENABLE_TOKENIZER_GSE=true \
            semitechnologies/weaviate:1.28.4
      - name: 等端口就绪（超时即失败，不允许伪装成 skip）
        run: |
          for i in $(seq 1 60); do
            if nc -z 127.0.0.1 19530 && nc -z 127.0.0.1 9035; then echo ready; exit 0; fi
            sleep 2
          done
          echo "::error::Milvus/Weaviate 未在 120s 内就绪"
          docker logs it-milvus | tail -50 || true
          docker logs it-weaviate | tail -50 || true
          exit 1
      - name: 发现 IT 类（改名导致 0 发现必须红）
        run: |
          n=$(grep -rl 'class .*IT' retrieval-engine/src/test/java --include='*IT.java' | wc -l)
          echo "discovered $n IT classes"
          test "$n" -ge 2
      - name: 安装依赖（跳过测试）
        run: mvn -B -q -DskipTests install
      - name: 真实驱动集成（-Pit + env）
        env:
          RAGAGENT_MILVUS_IT: "true"
          RAGAGENT_WEAVIATE_IT: "true"
        run: mvn -B -Pit -pl retrieval-engine verify
      - name: failsafe 汇总（ok/failed/skipped）
        if: always()
        run: |
          grep -hE 'Tests run:' retrieval-engine/target/failsafe-reports/*.txt 2>/dev/null || true
